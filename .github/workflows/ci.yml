name: CI

# 门禁分两层：
# - 确定性层（必过）：typecheck + 除 Electron 外的全部测试（适配器/检查器/core/dsl/i18n/report/cli/ai/store/freshness）。
# - 动态层（不阻塞）：基于 Electron stub 的测试（runtime/test、desktop/test）。GitHub Windows runner 上
#   Electron 首次启动是冷启动（二进制解压 + 安全软件扫描），且随 runner 波动（有的 run 能起、有的起不来），
#   故不参与合并门禁，失败仅告警。真实引擎 E2E 仍由 RM_REAL_PROJECT 门控，本机执行（见 docs/repair-plan.md）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 动态层硬编码 node_modules/electron/dist/electron.exe（Windows 路径），故门禁跑 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: 确定性测试（非 Electron）
        run: pnpm exec vitest run --exclude "packages/runtime/test/**" --exclude "packages/desktop/test/**"
      - name: 动态层测试（Electron stub，不阻塞门禁）
        continue-on-error: true
        timeout-minutes: 12
        env:
          # 无 GPU 的 runner 上 Electron 起不来（拿不到 page 目标）；软件渲染下可起
          RMTEST_ELECTRON_ARGS: "--disable-gpu --disable-software-rasterizer"
        run: pnpm exec vitest run packages/runtime/test packages/desktop/test

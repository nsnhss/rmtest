<!doctype html>
<html>
<head><meta charset="utf-8"><title>rmtest-spike</title></head>
<body>
<!--
  P0/P3 的运行时表面：模拟 MV 的 Game_Interpreter + 一个最小可玩世界，
  验证「场景 DSL 执行 + 断言」的机制。
  真实引擎（rpg_objects.js 等）的保真验证需要用户自有的 MV/MZ 工程。
-->
<script>
"use strict";

// —— MV 解释器表面（简化：同步推进，101 不等待） ——
class Game_Interpreter {
  constructor() {
    this._list = null;
    this._index = 0;
    this._finished = false;
    this._eventId = 0;
    this._data = { switches: null, transfer: null };
  }
  setup(list, eventId, data) {
    this._list = list;
    this._index = 0;
    this._finished = false;
    this._eventId = eventId;
    this._data = data;
  }
  isRunning() { return this._list !== null && !this._finished; }
  step() {
    if (!this.isRunning()) return;
    const cmd = this._list[this._index];
    if (!cmd || cmd.code === 0) { this._finished = true; return; }
    if (cmd.code === 111) {
      const taken = this._evalCondition(cmd);
      this._data.onBranch?.(cmd, taken);
      this._index++;
      if (!taken) {
        // 假：跳到 else(411) 体，或跳过 412 结束标记
        while (this._index < this._list.length) {
          const c = this._list[this._index];
          if ((c.code === 411 || c.code === 412) && c.indent === cmd.indent) { this._index++; return; }
          if (c.indent <= cmd.indent) return;
          this._index++;
        }
      }
      return;
    }
    if (cmd.code === 411) {
      // 真体撞上 else：跳到 412 之后
      this._index++;
      while (this._index < this._list.length) {
        const c = this._list[this._index];
        if (c.code === 412 && c.indent === cmd.indent) { this._index++; return; }
        if (c.indent <= cmd.indent) return;
        this._index++;
      }
      return;
    }
    if (cmd.code === 412) { this._index++; return; }
    this.executeCommand(cmd);
    this._index++;
    if (this._index >= this._list.length) this._finished = true;
  }
  _evalCondition(cmd) {
    const p = cmd.parameters;
    if (Number(p[0]) === 0) return this._data.switches.value(Number(p[1]));
    return false;
  }
  executeCommand(cmd) {
    const p = cmd.parameters;
    switch (cmd.code) {
      case 121:
        for (let i = p[0]; i <= p[1]; i++) this._data.switches.setValue(i, p[2] === 0);
        break;
      case 122:
        break;
      case 201:
        this._data.transfer = { mapId: p[0], x: p[1], y: p[2] };
        break;
      case 101:
      case 401:
      case 117:
        break;
    }
  }
}
window.Game_Interpreter = Game_Interpreter;

// —— 最小可玩世界（stub）：玩家 + 事件 + 开关/变量 ——
const WORLD_START = { mapId: 1, x: 2, y: 2 };

window.__game = (() => {
  const world = { ...WORLD_START, switches: {}, variables: {}, transfer: null };
  const interp = new Game_Interpreter();
  const counters = { pages: {}, branches: {} };

  // 地图 1 (2,2) 的事件：对话 → 开开关 1 → 分支(开关1 ON: 开开关2 / else: 开开关3) → 传送地图 2
  const events = {
    "1:2:2": [
      { code: 101, indent: 0, parameters: ["", 0, 0, 2] },
      { code: 401, indent: 1, parameters: ["你好，世界"] },
      { code: 121, indent: 0, parameters: [1, 1, 0] },
      { code: 111, indent: 0, parameters: [0, 1] },
      { code: 121, indent: 1, parameters: [2, 2, 0] },
      { code: 411, indent: 0, parameters: [] },
      { code: 121, indent: 1, parameters: [3, 3, 0] },
      { code: 412, indent: 0, parameters: [] },
      { code: 201, indent: 0, parameters: [2, 2, 2, 0, 0] },
      { code: 0, indent: 0, parameters: [] },
    ],
  };

  function runList(list, key) {
    const switches = {
      setValue(id, v) { world.switches[id] = !!v; },
      value(id) { return !!world.switches[id]; },
    };
    counters.pages[`${key}:0`] = (counters.pages[`${key}:0`] || 0) + 1;
    interp.setup(list, 1, {
      switches,
      transfer: null,
      onBranch(_cmd, taken) {
        const b = counters.branches[key] || { taken: 0, total: 0 };
        b.total += 1;
        if (taken) b.taken += 1;
        counters.branches[key] = b;
      },
    });
    let guard = 0;
    while (interp.isRunning() && guard++ < 10000) interp.step();
    if (interp._data.transfer) world.transfer = interp._data.transfer;
  }

  return {
    startNewGame() {
      world.mapId = WORLD_START.mapId;
      world.x = WORLD_START.x;
      world.y = WORLD_START.y;
      world.switches = {};
      world.variables = {};
      world.transfer = null;
    },
    walk(x, y) {
      world.x = x;
      world.y = y;
    },
    interact() {
      const key = `${world.mapId}:${world.x}:${world.y}`;
      const list = events[key];
      if (list) runList(list, key);
    },
    choose() { /* stub: 无对话分支 */ },
    counters() {
      return JSON.parse(JSON.stringify(counters));
    },
    snapshot() {
      return {
        mapId: world.mapId,
        x: world.x,
        y: world.y,
        switches: { ...world.switches },
        variables: { ...world.variables },
        transfer: world.transfer ? { ...world.transfer } : null,
      };
    },
  };
})();

window.__spike = {
  reset() { this.interpreter = new Game_Interpreter(); return this; },
  runEvent(list, eventId) {
    const switches = {};
    const data = {
      switches: {
        setValue(id, v) { switches[id] = !!v; },
        value(id) { return !!switches[id]; },
      },
      transfer: null,
    };
    this.interpreter.setup(list, eventId ?? 0, data);
    let guard = 0;
    while (this.interpreter.isRunning() && guard++ < 10000) this.interpreter.step();
    return {
      finished: this.interpreter._finished,
      eventId: this.interpreter._eventId,
      switch12: !!switches[12],
      switch2: !!switches[2],
      transfer: data.transfer,
    };
  },
};
</script>
</body>

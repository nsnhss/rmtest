name: CI

# 默认门禁：类型检查 + 全量测试（221 项；17 项真实引擎 E2E 由 RM_REAL_PROJECT 门控，CI 无真机故跳过）。
# 真机 E2E 需本机存在未加密/自有 MV/MZ 工程，按需手动执行：
#   RM_REAL_PROJECT=<游戏根> pnpm exec vitest run packages/runtime/test/realengine.test.ts
# 故 CI 只覆盖确定性层；动态层保真度由开发者本机验证（见 docs/repair-plan.md 阶段 5）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 动态层硬编码 node_modules/electron/dist/electron.exe（Windows 路径），故门禁跑 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

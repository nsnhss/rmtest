name: CI

# 默认门禁：类型检查 + 全量测试（当前 287 项；其中 18 项真实引擎 E2E 由 RM_REAL_PROJECT 门控，CI 无真机故跳过）。
# 真机 E2E 需本机存在自有 MV/MZ 工程，按需手动执行：
#   RM_REAL_PROJECT=<游戏根> pnpm exec vitest run packages/runtime/test/realengine.test.ts
# 故 CI 覆盖确定性层 + Electron stub 动态层；真实引擎保真度由开发者本机验证（见 docs/repair-plan.md 阶段 5）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 动态层硬编码 node_modules/electron/dist/electron.exe（Windows 路径），故门禁跑 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Electron 首次启动在冷 runner 上可能远超 30s（二进制刚解压 + 安全软件扫描）；
      # 相关用例已显式给出 90s 冷启动预算（packages/runtime/test/electron-fixture.ts 等）。
      - run: pnpm test
